name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 服务器/桌面
          - runner: ubuntu-24.04
            asset: linux-x86_64
          # aarch64（本机移动设备 / ARM 服务器，公开仓库可用的 ARM runner）
          - runner: ubuntu-24.04-arm
            asset: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 缓存 cargo（加速重复构建）
        uses: Swatinem/rust-cache@v2

      - name: 编译（release）
        run: cargo build --release --locked --verbose

      - name: 运行测试
        run: cargo test --release --locked

      - name: 整理产物
        run: |
          mkdir -p dist
          cp target/release/ftrace     dist/ftrace-${{ matrix.asset }}
          cp target/release/ftrace-web dist/ftrace-web-${{ matrix.asset }}
          ls -lh dist

      - name: 上传产物（Actions Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: ftrace-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

      - name: 发布到 GitHub Release（tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
