[package]
name = "ftrace"
version = "0.1.0"
edition = "2021"
description = "Image -> black & white line art -> Fourier transform (epicycle) coefficients + animation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/13055751/ftrace"

[dependencies]
image = { version = "0.25", default-features = true }
imageproc = "0.27"
rustfft = "6.4"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gif = "0.14"
clap = { version = "4", features = ["derive"] }
rayon = "1"
# Suzuki-Abe 外轮廓追踪(OpenCV findContours 纯 Rust 移植, Apache-2.0)
seiza-imgproc = "0.3"

# ---- ftrace-web 本地服务（src/bin/ftrace-web.rs，浏览器端）----
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
bytes = "1"
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true